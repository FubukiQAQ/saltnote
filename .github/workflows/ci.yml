name: SaltNote Alpha CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  rust-core-and-chaos-tests:
    name: Rust Core, Chaos & Privacy Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust workspace tests (CRDT 3-device, WebDAV 429 chaos, FSRS dedup, Privacy guard)
        working-directory: rust
        run: cargo test --workspace --verbose

  desktop-build-and-ffi-e2e:
    name: Desktop UniFFI & Compose Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Rust library, generate UniFFI Kotlin bindings & run Desktop E2E tests
        run: ./gradlew :app:nativeBridge:buildRustDesktop :app:nativeBridge:generateUniFFIBindings :app:nativeBridge:desktopTest :app:composeApp:desktopMainClasses --console=plain

  android-arm64-apk:
    name: Android ARM64 Cross-Compile & APK Size Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK r27c
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android ARM64 .so & Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./gradlew :app:nativeBridge:buildRustAndroidArm64 :app:androidApp:assembleDebug --console=plain
      - name: Enforce APK Size <= 35MB (MVP Section 6.1)
        run: |
          APK="app/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          SIZE_MB=$(du -m "$APK" | cut -f1)
          echo "Built APK size: ${SIZE_MB} MB"
          test "$SIZE_MB" -le 35
